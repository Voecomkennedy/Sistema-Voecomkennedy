<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Voecomkennedy</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0A1931">
    <meta name="application-name" content="Voecomkennedy">
    <meta name="apple-mobile-web-app-title" content="Voecomkennedy">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A1931 0%, #1a2733 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
        }
        .login-card {
            width: 100%;
            max-width: 410px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #0A1931 0%, #34495e 100%);
            color: #fff;
            text-align: center;
            padding: 34px 24px 28px;
        }
        .login-logo {
            width: 88px;
            height: 88px;
            border: 1px solid rgba(212,175,55,0.7);
            border-radius: 22px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.35);
            display: block;
            margin: 0 auto 14px;
            object-fit: cover;
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }
        .login-header p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        .login-body { padding: 30px 28px 32px; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #0A1931; }
        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
            border: 1.5px solid #e3e6ea;
        }
        .form-control:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 0.2rem rgba(212,175,55,0.18);
        }
        .btn-entrar {
            background: #D4AF37;
            border: none;
            color: #0A1931;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-entrar:hover { background: #c19f2e; }
        .btn-entrar:disabled { opacity: 0.7; }
        .input-group .toggle-senha {
            border: 1.5px solid #e3e6ea;
            border-left: none;
            background: #fff;
            border-radius: 0 10px 10px 0;
            color: #6c757d;
            cursor: pointer;
        }
        .login-footer {
            text-align: center;
            font-size: 0.78rem;
            color: #9aa3ab;
            padding-bottom: 22px;
        }
        .alerta-erro {
            display: none;
            background: #fdecea;
            color: #c0392b;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
    </style>
<style>
body { background:#F6FAFD; color:#0A1931; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.login-card { max-width:410px; border:1px solid #DFE7EE; border-radius:12px; box-shadow:0 12px 40px #0A19310A; }
.login-header { background:#fff; color:#0A1931; padding:30px 24px 24px; border-bottom:1px solid #E7EDF2; }
.login-logo { width:56px; height:56px; border:0; border-radius:12px; box-shadow:none; margin-bottom:16px; }
.login-header h1 { font-weight:650; letter-spacing:-.5px; }
.login-header p { color:#64748B; font-size:13px; }
.login-body { padding:24px; }
.form-control { min-height:44px; border-color:#D3E0EA; border-radius:7px; }
.form-label { color:#405469; font-size:12px; font-weight:500; }
.btn-primary,.btn-login { background:#1A3D63; border-color:#1A3D63; border-radius:7px; min-height:44px; box-shadow:none; }
.btn-primary:hover,.btn-login:hover { background:#0A1931; border-color:#0A1931; }
</style>
</head>
<body>
    <main class="login-card">
        <header class="login-header">
            <img src="icons/icon-192.png" alt="Logo Voecomkennedy" class="login-logo">
            <h1>Voecomkennedy</h1>
            <p>Sistema de Emissão de Passagens</p>
        </header>

        <section class="login-body">
            <div class="alerta-erro" id="alertaErro"></div>

            <form id="formLogin" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="senha">Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="senha" placeholder="Sua senha" required style="border-radius: 10px 0 0 10px;">
                        <span class="toggle-senha" id="toggleSenha"><i class="bi bi-eye"></i></span>
                    </div>
                </div>

                <button type="submit" class="btn-entrar" id="btnEntrar">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>
        </section>

        <footer class="login-footer">
            © Voecomkennedy · Seus dados salvos na nuvem com segurança
        </footer>
    </main>

    <!-- Supabase + scripts do sistema -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=10"></script>
    <script src="js/auth.js?v=12"></script>

    <script>
        const form = document.getElementById('formLogin');
        const alertaErro = document.getElementById('alertaErro');
        const btnEntrar = document.getElementById('btnEntrar');
        const toggleSenha = document.getElementById('toggleSenha');
        const inputSenha = document.getElementById('senha');

        // Mostrar/esconder senha
        toggleSenha.addEventListener('click', () => {
            const tipo = inputSenha.type === 'password' ? 'text' : 'password';
            inputSenha.type = tipo;
            toggleSenha.innerHTML = tipo === 'password'
                ? '<i class="bi bi-eye"></i>'
                : '<i class="bi bi-eye-slash"></i>';
        });

        function mostrarErro(msg) {
            alertaErro.textContent = msg;
            alertaErro.style.display = 'block';
        }

        // Se já estiver logado, vai direto pro Dashboard
        (async () => {
            const user = await Auth.getUser();
            if (user) window.location.href = 'index.html';
        })();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertaErro.style.display = 'none';

            const email = document.getElementById('email').value;
            const senha = inputSenha.value;

            btnEntrar.disabled = true;
            btnEntrar.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Entrando...';

            const resultado = await Auth.login(email, senha);

            if (resultado.ok) {
                window.location.href = 'index.html';
            } else {
                mostrarErro(resultado.erro);
                btnEntrar.disabled = false;
                btnEntrar.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar';
            }
        });
    </script>
</body>
</html>
